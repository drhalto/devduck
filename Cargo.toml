[package]
name = "devduck"
version = "2.1.0"
edition = "2024"
description = "Start, stop and open every project on your PC, and see what is listening on your ports."
license = "MIT"
repository = "https://github.com/drhalto/devduck"
publish = false

[lib]
name = "devduck"
path = "src/lib.rs"

# Console CLI: `devduck list`, `devduck who 3000`... With no arguments it opens the window.
[[bin]]
name = "devduck"
path = "src/main.rs"

# The window (GUI subsystem). This is the one to pin to the taskbar.
[[bin]]
name = "devduck-app"
path = "src/bin/app.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
egui_extras = { version = "0.36", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcodegen = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
